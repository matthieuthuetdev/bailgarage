                    <input type="number" name="lotNumber" id="lotNumber" value="">

                <div>

                    <input type="number" step="0.01" name="rentWithoutCharges" id="rentWithoutCharges" required value="">

                <div>

                    <input type="number" step="0.01" name="charges" id="charges" required value="">
